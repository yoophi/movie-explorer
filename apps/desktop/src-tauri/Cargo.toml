[package]
name = "movie-explorer"
version = "0.1.0"
description = "A Tauri movie explorer desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "movie_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
explorer-fs-core = { path = "../../../../explorer-kit/crates/fs-core" }
explorer-scan-job = { path = "../../../../explorer-kit/crates/scan-job" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
